[package]
name = "splat3-widget-core"
version = "0.3.7"
edition = "2021"
publish = false

[dependencies]
keyring = { version = "4.2", features = ["v1"] }
base64 = "0.22"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["deflate", "gzip", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

