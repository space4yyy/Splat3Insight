<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>斯普拉遁 3 字体数字预览</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111816;
        color: #f2f4ed;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(ellipse at 6% 0%, rgb(230 255 68 / 12%), transparent 30rem),
          radial-gradient(ellipse at 100% 20%, rgb(255 79 163 / 10%), transparent 34rem),
          #111816;
      }

      main {
        width: 100%;
        margin: 0;
        padding: 32px clamp(16px, 2.5vw, 40px) 64px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #e6ff44;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.05;
        letter-spacing: -.04em;
      }

      .intro {
        max-width: 760px;
        margin: 14px 0 26px;
        color: #b9c2bc;
        font-size: 14px;
        line-height: 1.65;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .count { color: #b9c2bc; font-size: 13px; }

      input {
        width: min(290px, 52vw);
        padding: 10px 12px;
        border: 1px solid #39443f;
        border-radius: 8px;
        outline: none;
        background: #1a2420;
        color: #f2f4ed;
        font: inherit;
      }

      input:focus { border-color: #e6ff44; }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .font-card {
        min-width: 0;
        padding: 17px clamp(16px, 2vw, 28px) 18px;
        border: 1px solid #303b36;
        border-radius: 10px;
        background: linear-gradient(145deg, #202a26, #18211e 72%);
        box-shadow: 0 8px 24px rgb(0 0 0 / 13%);
      }

      .font-card[hidden] { display: none; }

      .font-card__meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #aab4ad;
        font-size: 11px;
      }

      .font-card__name {
        min-width: 0;
        overflow: hidden;
        color: #f2f4ed;
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .font-card__format {
        flex: 0 0 auto;
        padding: 4px 7px;
        border-radius: 999px;
        background: #303b36;
        color: #d2dad4;
        font-size: 10px;
        letter-spacing: .04em;
      }

      .font-card__sample {
        margin-top: 13px;
        width: 100%;
        overflow: visible;
        color: #e6ff44;
        font-size: clamp(22px, 10vw, 220px);
        line-height: 1.18;
        letter-spacing: .015em;
        white-space: nowrap;
        font-synthesis: none;
      }

      .font-card__status {
        min-height: 16px;
        margin-top: 9px;
        color: #aab4ad;
        font-size: 11px;
      }

      .font-card[data-loaded="true"] .font-card__status { color: #a8dc83; }
      .font-card[data-loaded="false"] .font-card__status { color: #ff89b7; }

      .note {
        margin: 20px 0 0;
        color: #99a49d;
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 560px) {
        main { padding: 24px 12px 48px; }
        .toolbar { align-items: stretch; flex-direction: column; }
        input { width: 100%; }
        .grid { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">SPLATOON 3 · FONT SHEET</p>
      <h1>数字字体预览</h1>
      <p class="intro">
        按照字体目录中的可直接预览文件逐款展示数字 0–9。卡片使用同一字号和颜色，便于比较数字的宽窄、粗细与造型。
      </p>

      <div class="toolbar">
        <div class="count" id="count"></div>
        <input id="filter" type="search" placeholder="筛选字体文件名" autocomplete="off" />
      </div>

      <section class="grid" id="font-grid" aria-label="字体数字预览"></section>

      <p class="note">
        字体直接从相邻的 <code>splatoon3-fonts</code> 目录读取。NintendoFormat 中的 .bfotf / .bfttf 是游戏资源格式，浏览器无法直接加载，因此这里列出 Decrypted 和 ExtraFormat 中的标准字体文件。
      </p>
    </main>

    <script>
      const fonts = [
        { file: "AsiaKCUBE-R.ttf", folder: "Decrypted", format: "truetype" },
        { file: "SpAlterna-Regular.otf", folder: "Decrypted", format: "opentype" },
        { file: "NinSplatoonSdodrNumber-Reg.otf", folder: "Decrypted", format: "opentype" },
        { file: "NinSplatoonSdodrNumber-Reg.ttf", folder: "Decrypted", format: "truetype" },
        { file: "AsiaKERIN-M.ttf", folder: "Decrypted", format: "truetype" },
        { file: "DFP_GBZY7.ttf", folder: "Decrypted", format: "truetype" },
        { file: "DFP_GBZY9.ttf", folder: "Decrypted", format: "truetype" },
        { file: "nintendoP_DotGothic12-M.otf", folder: "Decrypted", format: "opentype" },
        { file: "DFPT_ZY9.ttf", folder: "Decrypted", format: "truetype" },
        { file: "DFPT_AZ5.ttf", folder: "Decrypted", format: "truetype" },
        { file: "FOT-RowdyStd-EB.otf", folder: "Decrypted", format: "opentype" },
        { file: "BlitzBold.otf", folder: "Decrypted", format: "opentype" },
        { file: "FOT-KurokaneStd-EB.otf", folder: "Decrypted", format: "opentype" },
        { file: "BlitzMain.otf", folder: "Decrypted", format: "opentype" },
        { file: "BlitzMain.woff2", folder: "ExtraFormat", format: "woff2" },
      ];

      const grid = document.querySelector("#font-grid");
      const count = document.querySelector("#count");
      const filter = document.querySelector("#filter");
      const style = document.createElement("style");
      const measureCanvas = document.createElement("canvas");
      const measureContext = measureCanvas.getContext("2d");
      const cards = [];

      fonts.forEach((font, index) => {
        const family = `preview-font-${index}`;
        const url = `../splatoon3-fonts/${font.folder}/${font.file}`;
        style.textContent += `@font-face { font-family: "${family}"; src: url("${url}") format("${font.format}"); font-style: normal; font-weight: 400; font-display: swap; }\n`;

        const card = document.createElement("article");
        card.className = "font-card";
        card.dataset.filename = font.file.toLowerCase();

        const meta = document.createElement("div");
        meta.className = "font-card__meta";

        const name = document.createElement("span");
        name.className = "font-card__name";
        name.textContent = font.file;

        const format = document.createElement("span");
        format.className = "font-card__format";
        format.textContent = `${font.folder} · ${font.format}`;

        const sample = document.createElement("div");
        sample.className = "font-card__sample";
        sample.style.fontFamily = `"${family}", sans-serif`;
        sample.textContent = "0123456789";
        sample.setAttribute("aria-label", "数字 0 到 9");

        const status = document.createElement("div");
        status.className = "font-card__status";
        status.textContent = "字体加载中…";

        meta.append(name, format);
        card.append(meta, sample, status);
        grid.append(card);
        cards.push(card);
      });

      document.head.append(style);
      count.textContent = `共 ${fonts.length} 个字体文件`;

      function fitSample(sample) {
        const availableWidth = sample.clientWidth;
        if (!measureContext || availableWidth <= 0) return;

        const family = sample.style.fontFamily;
        measureContext.font = `400 100px ${family}`;
        const textWidthPerEm = measureContext.measureText(sample.textContent).width / 100;
        const letterSpacingPerEm = 0.015 * Math.max(0, sample.textContent.length - 1);
        const fittedSize = (availableWidth * 0.96) / (textWidthPerEm + letterSpacingPerEm);
        sample.style.fontSize = `${Math.min(320, fittedSize)}px`;
      }

      function fitAllSamples() {
        document.querySelectorAll(".font-card__sample").forEach(fitSample);
      }

      window.addEventListener("resize", fitAllSamples);

      filter.addEventListener("input", () => {
        const query = filter.value.trim().toLowerCase();
        let visible = 0;
        cards.forEach((card) => {
          card.hidden = query !== "" && !card.dataset.filename.includes(query);
          if (!card.hidden) visible += 1;
        });
        count.textContent = `显示 ${visible} / ${fonts.length} 个字体文件`;
      });

      Promise.all(fonts.map(async (font, index) => {
        const card = cards[index];
        const status = card.querySelector(".font-card__status");
        const result = await Promise.race([
          document.fonts.load(`64px "preview-font-${index}"`, "0123456789")
            .then((face) => ({ face }))
            .catch((error) => ({ error })),
          new Promise((resolve) => setTimeout(() => resolve({ timeout: true }), 12000)),
        ]);
        const loaded = result.face?.some((entry) => entry.status === "loaded") ?? false;
        card.dataset.loaded = String(loaded);
        status.textContent = loaded
          ? `已加载 · ${font.folder}/${font.file}`
          : result.timeout
            ? `加载超时 · ${font.folder}/${font.file}`
            : result.error
              ? `加载失败 · ${result.error.name || "错误"}: ${result.error.message || "浏览器无法读取字体资源"}`
              : `加载失败 · 浏览器未匹配到可用字体资源`;
        fitSample(card.querySelector(".font-card__sample"));
      }));

      fitAllSamples();
    </script>
  </body>
</html>
