<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat 3 Streaming Widget</title>
    <style>
      @font-face {
        font-family: "DFP GBZY7";
        src: url("./fonts/DFP_GBZY7.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111117; color: #f5f5f2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0%, #2b214a 0, #111117 48%); }
      main { width: min(520px, 100%); margin: 0 auto; padding: 34px 28px 28px; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .02em; }
      p { color: #aaa8b5; line-height: 1.5; }
      .panel { margin-top: 24px; padding: 20px; border: 1px solid #393746; border-radius: 18px; background: #1b1a23d9; }
      button { border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700; color: #171716; background: #ecff20; cursor: pointer; }
      button.secondary { color: #f5f5f2; background: #34333d; }
      button:disabled { opacity: .55; cursor: wait; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .account { padding: 14px 0; border-bottom: 1px solid #35343e; }
      .account:last-child { border-bottom: 0; }
      .account-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
      .account small, .status { color: #9d9aa8; }
      .badge { color: #111; background: #ecff20; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
      .badge-secondary { color: #f5f5f2; background: #4b4857; }
      #message { min-height: 24px; margin: 14px 0 0; color: #bdbbc7; white-space: pre-line; }
      .error { color: #ff668a !important; }
      .auth-note { margin: 8px 0 0; font-size: 12px; color: #8e8b9a; }
      #paste-panel { display: none; margin-top: 18px; }
      #paste-panel.visible { display: block; }
      textarea { width: 100%; min-height: 92px; resize: vertical; border: 1px solid #4b4857; border-radius: 12px; padding: 10px; color: #f5f5f2; background: #111117; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .paste-help { margin: 8px 0 10px; font-size: 13px; color: #9d9aa8; }
      .overlay-preview { margin-top: 16px; padding: 16px 0 2px; overflow: hidden; }
      .overlay-card { width: max-content; min-width: min(420px, 100%); max-width: 100%; overflow: hidden; padding: 8px 16px 10px; border-radius: 6px; color: #f5f5f2; background: #383838; font-family: "DFP GBZY7", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; }
      .overlay-card__top, .overlay-card__bottom { display: flex; align-items: baseline; gap: 18px; }
      .overlay-card__mode { display: flex; align-items: flex-end; gap: 6px; color: #f5f5f2; font-size: 21px; line-height: .9; letter-spacing: .04em; }
      .overlay-card__mode.mode-x-match { color: #0fdb9b; }
      .overlay-card__mode.mode-bankara { color: #f54910; }
      .overlay-card__bankara-mode { color: #f54910; font-size: 12px; line-height: 1; margin-bottom: 1px; white-space: nowrap; }
      .overlay-card__summary { display: flex; align-items: baseline; gap: 14px; margin-left: auto; color: #f5f5f2; font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
      .overlay-card__summary-win { color: #eaff3d; }
      .overlay-card__summary-lose { color: #4d7cff; }
      .overlay-card__bottom { align-items: flex-end; justify-content: flex-start; margin-top: 10px; padding-top: 0; }
      .overlay-card__power { display: flex; align-items: flex-end; gap: 8px; min-height: 44px; font-size: 72px; line-height: .82; letter-spacing: -.08em; }
      .overlay-card__power-value { color: #fff; }
      .overlay-card__power-delta { margin-bottom: 0; font-size: 26px; line-height: .82; letter-spacing: -.04em; }
      .overlay-card__power-value.is-placeholder,
      .overlay-card__power-delta.is-placeholder,
      .overlay-card__kad .is-placeholder {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        letter-spacing: 0;
      }
      .overlay-card__power-value.is-placeholder { font-size: .58em; margin-bottom: .12em; }
      .overlay-card__power-delta.is-placeholder { font-size: 18px; margin-bottom: .08em; }
      .overlay-card__power-delta.positive { color: #eaff3d; }
      .overlay-card__power-delta.negative { color: #4d7cff; }
      .overlay-card__stats { display: flex; align-items: flex-end; margin-left: auto; }
      .overlay-card__kad { display: flex; gap: 18px; color: #f5f5f2; font-size: 28px; font-weight: 800; }
      .overlay-card__kad span { display: flex; align-items: baseline; gap: 0; }
      .overlay-card__kad span:first-child { color: #eaff3d; }
      .overlay-card__kad small { color: #bdbdbd; font-size: 16px; letter-spacing: .08em; }
      .overlay-empty { padding: 24px 0; color: #9d9aa8; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>Splat 3 Streaming Widget</h1>
      <p>先完成 Nintendo Account 登录，再获取 SplatNet 权限。随后可以同步最近 50 条对战和 50 条打工记录。</p>
      <p class="auth-note">登录信息保存在系统凭据库，历史记录保存在本机应用数据目录；密码不会进入本应用。</p>
      <p class="auth-note">SplatNet 权限通过 nxapi 自动获取，应用已内置 client id，无需额外配置。</p>
      <section class="panel">
        <div class="row">
          <strong>账号</strong>
          <button id="login">登录 Nintendo Account</button>
        </div>
        <div id="paste-panel">
          <p class="paste-help">在浏览器登录后，右键“选择此人”按钮，复制链接地址并粘贴到这里。</p>
          <textarea id="login-link" autocomplete="off" spellcheck="false" placeholder="粘贴 Nintendo 账号选择链接"></textarea>
          <div style="margin-top:10px; text-align:right"><button id="authenticate">开始认证</button></div>
        </div>
        <div id="message" class="status">正在读取账号列表…</div>
        <div id="accounts"></div>
      </section>
      <section class="panel">
        <div class="row">
          <strong>卡片预览</strong>
          <button id="refresh-overlay" class="secondary">刷新</button>
        </div>
        <p class="auth-note">OBS 浏览器源地址：<code>http://127.0.0.1:17353/overlay</code></p>
        <div id="overlay-preview" class="overlay-preview">
          <div class="overlay-empty">登录并同步历史后显示真实对战数据。</div>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
