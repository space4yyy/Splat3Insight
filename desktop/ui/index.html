<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>斯普拉遁3直播小组件</title>
    <link rel="stylesheet" href="./overlay-card.css" />
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111117; color: #f5f5f2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0%, #2b214a 0, #111117 48%); }
      main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 32px; }
      h1 { margin: 0; font-size: 30px; letter-spacing: .02em; }
      p { color: #aaa8b5; line-height: 1.5; }
      .panel { margin-top: 18px; padding: 20px 22px; border: 1px solid #393746; border-radius: 18px; background: #1b1a23d9; }
      button { border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700; color: #171716; background: #ecff20; cursor: pointer; }
      button.secondary { color: #f5f5f2; background: #34333d; }
      button.danger { color: #fff; background: #8e2f44; }
      button:disabled { opacity: .55; cursor: wait; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .overlay-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
      .overlay-actions button { padding: 8px 12px; font-size: 12px; }
      .account { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 14px 0; border-bottom: 1px solid #35343e; }
      .account:last-child { border-bottom: 0; }
      .account-main { display: flex; align-items: baseline; min-width: 0; gap: 10px; }
      .account-name { font-size: 17px; }
      .account-history { white-space: nowrap; }
      .account-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: nowrap; min-width: max-content; }
      .account-actions button { padding: 8px 14px; font-size: 13px; }
      .account small, .status { color: #9d9aa8; }
      .badge { display: inline-flex; align-items: center; min-height: 34px; color: #111; background: #ecff20; border-radius: 999px; padding: 8px 14px; font-size: 13px; line-height: 1; font-weight: 700; }
      .badge-secondary { color: #f5f5f2; background: #4b4857; }
      #message { min-height: 24px; margin: 14px 0 0; color: #bdbbc7; white-space: pre-line; }
      #sync-status { min-height: 20px; margin: 4px 0 0; color: #9d9aa8; white-space: pre-line; }
      #sync-status.syncing { color: #ecff20; }
      .service-status { min-height: 20px; margin: 8px 0 0; color: #9d9aa8; font-size: 13px; white-space: pre-line; overflow-wrap: anywhere; }
      .service-status.running { color: #62e6ad; }
      .service-status.starting { color: #ecff20; }
      .service-status.stopped { color: #aaa8b5; }
      .error { color: #ff668a !important; }
      .auth-note { margin: 8px 0 0; font-size: 12px; color: #8e8b9a; }
      #paste-panel { display: none; margin-top: 18px; }
      #paste-panel.visible { display: block; }
      .auth-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
      .auth-actions button { padding: 10px 14px; font-size: 13px; }
      textarea { width: 100%; min-height: 92px; resize: vertical; border: 1px solid #4b4857; border-radius: 12px; padding: 10px; color: #f5f5f2; background: #111117; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .paste-help { margin: 8px 0 10px; font-size: 13px; color: #9d9aa8; }
      .overlay-url-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
      .overlay-url-row code { min-width: 0; flex: 1; overflow-wrap: anywhere; color: #aaa8b5; font-size: 13px; }
      .overlay-url-row button { flex: 0 0 auto; padding: 8px 12px; font-size: 12px; }
      .obs-help { margin-top: 8px; color: #aaa8b5; font-size: 12px; }
      .overlay-preview { margin-top: 14px; padding: 8px 0 2px; overflow: hidden; }
      .overlay-preview__viewport { display: flex; align-items: flex-start; justify-content: center; overflow: hidden; width: 100%; }
      .overlay-preview__scale { width: max-content; transform-origin: top center; }
      .overlay-empty { padding: 24px 0; color: #9d9aa8; text-align: center; }
      @media (max-width: 700px) {
        main { width: calc(100% - 20px); padding-top: 20px; }
        .panel { padding: 16px; }
        .overlay-preview { margin-top: 14px; }
      }
      @media (max-width: 480px) {
        .account { grid-template-columns: 1fr; gap: 10px; }
        .account-actions { justify-content: flex-start; }
        .overlay-url-row { align-items: stretch; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>斯普拉遁3直播小组件</h1>
      <section class="panel">
        <div class="row">
          <strong>账号</strong>
          <button id="login">添加 Nintendo Account</button>
        </div>
        <div id="paste-panel">
          <p class="paste-help">在浏览器登录后，右键“选择此人”按钮，复制链接地址并粘贴到这里。</p>
          <textarea id="login-link" autocomplete="off" spellcheck="false" placeholder="粘贴 Nintendo 账号选择链接"></textarea>
          <div class="auth-actions">
            <button id="cancel-login" class="secondary" type="button">取消</button>
            <button id="authenticate" type="button">开始认证</button>
          </div>
        </div>
        <div id="message" class="status">正在读取账号列表…</div>
        <div id="sync-status" class="status">正在检查同步状态…</div>
        <div id="accounts"></div>
      </section>
      <section class="panel">
        <div class="row">
          <strong>卡片预览</strong>
          <div class="overlay-actions">
            <button id="start-overlay-service" class="secondary" hidden>启动服务</button>
            <button id="stop-overlay-service" class="secondary" hidden>停止服务</button>
          </div>
        </div>
        <div class="overlay-url-row">
          <code>http://127.0.0.1:17353/overlay</code>
          <button id="copy-overlay-url" class="secondary">复制 OBS 地址</button>
        </div>
        <div class="obs-help">
          OBS 尺寸推荐：460 x 100
        </div>
        <div id="overlay-service-status" class="service-status">正在检查 OBS 服务状态…</div>
        <div id="overlay-preview" class="overlay-preview">
          <div class="overlay-empty">登录并同步历史后显示真实对战数据。</div>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
