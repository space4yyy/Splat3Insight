<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat 3 Overlay</title>
    <link rel="stylesheet" href="/overlay-card.css" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { width: 560px; height: 100px; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="/overlay-card-renderer.js"></script>
    <script>
      const root = document.querySelector('#root');
      const BASE_WIDTH = 560;
      const BASE_HEIGHT = 100;
      let lastState = null;

      function fitOverlay() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const scale = viewportWidth > 0 && viewportHeight > 0
          ? Math.min(1, viewportWidth / BASE_WIDTH, viewportHeight / BASE_HEIGHT)
          : 1;
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        const card = root.querySelector('.overlay-card');
        if (card) {
          card.style.transformOrigin = 'top left';
          card.style.transform = `scale(${safeScale})`;
        }
        root.style.width = `${BASE_WIDTH * safeScale}px`;
        root.style.height = `${BASE_HEIGHT * safeScale}px`;
      }

      function render(state) {
        root.innerHTML = window.Splat3OverlayCard.render(state);
        fitOverlay();
      }

      async function update() {
        try {
          const response = await fetch('/api/overlay', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`Overlay 数据请求失败（HTTP ${response.status}）`);
          }
          const state = await response.json();
          if (state?.error) throw new Error(state.error);
          lastState = state;
          render(state);
          // 字体加载失败不应阻止卡片显示；先用 fallback 渲染，字体可用后再刷新一次。
          document.fonts.load('16px "DFP GBZY7"')
            .then(() => render(lastState))
            .catch(() => {});
        } catch (_) {
          // 保留上一次有效卡片，等待下一轮轮询恢复，避免短暂请求失败导致 OBS 闪烁。
        }
      }

      update();
      window.addEventListener('resize', fitOverlay);
      window.setInterval(update, 5000);
    </script>
  </body>
</html>
