<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat 3 Overlay</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/overlay-card.css" />
    <style>
      :root { --obs-card-width: __OBS_CARD_WIDTH__px; --obs-card-height: __OBS_CARD_HEIGHT__px; }
      #root > .overlay-card { --obs-card-width: 320px; --obs-card-height: 80px; }
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { width: var(--obs-card-width); height: var(--obs-card-height); }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="/game-names.js"></script>
    <script src="/overlay-card-renderer.js"></script>
    <script>
      const root = document.querySelector('#root');
      const params = new URLSearchParams(window.location.search);
      const selectedTypes = ['bankaramatch', 'xmatch', 'salmonrun'].filter((type) => params.has(type));
      function fitOverlay() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const card = root.querySelector('.overlay-card, .salmon-run-card');
        if (!card) return;
        const cardWidth = card.offsetWidth;
        const cardHeight = card.offsetHeight;
        const scale = viewportWidth > 0 && viewportHeight > 0
          ? Math.min(1, viewportWidth / cardWidth, viewportHeight / cardHeight)
          : 1;
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        card.style.transformOrigin = 'top left';
        card.style.transform = `scale(${safeScale})`;
        root.style.width = `${cardWidth * safeScale}px`;
        root.style.height = `${cardHeight * safeScale}px`;
      }

      async function fetchState(matchType) {
        const apiUrl = matchType ? `/api/overlay?${matchType}` : '/api/overlay';
        const response = await fetch(apiUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Overlay 数据请求失败（HTTP ${response.status}）`);
        }
        const state = await response.json();
        if (state?.error) throw new Error(state.error);
        return state;
      }

      // 选了多种卡片时，显示其中最近一条记录对应的那种；有新记录就切过去。
      async function loadSelectedState() {
        const matchTypes = selectedTypes.filter((type) => type !== 'salmonrun');
        const states = Object.fromEntries(await Promise.all(
          matchTypes.map(async (type) => [type, await fetchState(type)])
        ));
        if (selectedTypes.includes('salmonrun')) {
          // 每种对战状态都带有鲑鱼跑数据，只选了鲑鱼跑时才单独请求。
          states.salmonrun = matchTypes.length ? states[matchTypes[0]] : await fetchState(null);
        }
        const type = selectedTypes.length > 1
          ? window.Splat3OverlayCard.newestCardType(states)
          : selectedTypes[0];
        return { type, state: type ? states[type] : null };
      }

      async function update() {
        try {
          if (!selectedTypes.length) {
            window.Splat3OverlayCard.updateAuto(root, await fetchState(null));
          } else {
            const { type, state } = await loadSelectedState();
            if (type === 'salmonrun') {
              window.Splat3OverlayCard.updateSalmonRun(root, state);
            } else if (type) {
              window.Splat3OverlayCard.update(root, state);
            }
          }
          fitOverlay();
        } catch (_) {
          // 保留上一次有效卡片，等待下一轮轮询恢复，避免短暂请求失败导致 OBS 闪烁。
        }
      }

      // 数字字体和中文字体完成加载后浏览器会自行重绘，无需重建卡片 DOM。
      document.fonts.load('16px "DFP GBZY7"').catch(() => {});
      document.fonts.load('16px "BlitzMain"').catch(() => {});
      update();
      window.addEventListener('resize', fitOverlay);
      window.setInterval(update, 5000);
    </script>
  </body>
</html>
