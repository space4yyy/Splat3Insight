<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat 3 Salmon Run Overlay</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/overlay-card.css" />
    <style>
      :root { --obs-card-width: __OBS_CARD_WIDTH__px; --obs-card-height: __OBS_CARD_HEIGHT__px; }
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { width: var(--obs-card-width); height: var(--obs-card-height); }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="/game-names.js"></script>
    <script src="/overlay-card-renderer.js"></script>
    <script>
      const root = document.querySelector('#root');
      function fitOverlay() {
        const card = root.querySelector('.salmon-run-card');
        if (!card) return;
        const scale = Math.min(1, window.innerWidth / card.offsetWidth, window.innerHeight / card.offsetHeight);
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        card.style.transformOrigin = 'top left';
        card.style.transform = `scale(${safeScale})`;
        root.style.width = `${card.offsetWidth * safeScale}px`;
        root.style.height = `${card.offsetHeight * safeScale}px`;
      }
      async function update() {
        try {
          const response = await fetch('/api/overlay', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const state = await response.json();
          window.Splat3OverlayCard.updateSalmonRun(root, state);
          fitOverlay();
        } catch (_) {
          // Keep the last valid card visible while the local data service recovers.
        }
      }
      document.fonts.load('16px "DFP GBZY7"').catch(() => {});
      document.fonts.load('16px "BlitzMain"').catch(() => {});
      update();
      window.addEventListener('resize', fitOverlay);
      window.setInterval(update, 5000);
    </script>
  </body>
</html>
