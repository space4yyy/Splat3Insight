<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>私房随武</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * { box-sizing: border-box; }
      :root { --obs-card-width: __OBS_CARD_WIDTH__px; --obs-card-height: __OBS_CARD_HEIGHT__px; }
      html, body { width: var(--obs-card-width); height: var(--obs-card-height); margin: 0; overflow: hidden; background: transparent; }
      #weapons { width: var(--obs-card-width); height: var(--obs-card-height); display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: 20px repeat(4, 1fr); gap: 4px; border-radius: 6px; background: rgb(0 0 0 / 22%); }
      .team-label { display: grid; place-items: center; color: #000; font: 900 20px/20px system-ui, sans-serif; text-shadow: 0 0 2px rgb(255 255 255 / 75%); }
      img { display: block; width: 80px; height: 80px; object-fit: contain; }
    </style>
  </head>
  <body>
    <main id="weapons" aria-label="私房随武图片，A、B 两队"></main>
    <script>
      const root = document.querySelector('#weapons');
      const isPreview = new URLSearchParams(location.search).has('preview');
      let currentSetId = null;

      function render(state) {
        if (!state?.set_id || state.set_id === currentSetId) return;
        if (state.team_a?.length !== 4 || state.team_b?.length !== 4) return;
        const fragment = document.createDocumentFragment();
        for (const team of ['A', 'B']) {
          const label = document.createElement('span');
          label.className = 'team-label';
          label.textContent = team;
          fragment.append(label);
        }
        for (let index = 0; index < 4; index += 1) {
          for (const team of [state.team_a, state.team_b]) {
            const weapon = team[index];
            const image = document.createElement('img');
            image.src = `/weapons/${encodeURIComponent(weapon.row_id)}.png`;
            image.alt = '';
            image.draggable = false;
            fragment.append(image);
          }
        }
        root.replaceChildren(fragment);
        currentSetId = state.set_id;
      }

      async function refresh() {
        try {
          const response = await fetch('/api/random-weapons', { cache: 'no-store' });
          if (!response.ok) return;
          render(await response.json());
        } catch (_) {
          // Keep the last assignment visible while the local service recovers.
        }
      }

      async function randomizeOnPageLoad() {
        if (!isPreview) {
          try {
            await fetch('/api/random-weapons/refresh', { method: 'POST', cache: 'no-store' });
          } catch (_) {
            // The saved assignment remains available if refreshing fails.
          }
        }
        await refresh();
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || event.data?.type !== 'refresh-random-weapons') return;
        void refresh();
      });

      randomizeOnPageLoad();
      window.setInterval(refresh, 1000);
    </script>
  </body>
</html>
