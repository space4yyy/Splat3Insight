<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat 3 Clock</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/overlay-card.css" />
    <style>
      :root { --obs-card-width: __OBS_CARD_WIDTH__px; --obs-card-height: __OBS_CARD_HEIGHT__px; }
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { width: var(--obs-card-width); height: var(--obs-card-height); }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="/overlay-card-renderer.js"></script>
    <script>
      const root = document.querySelector('#root');
      function fitOverlay() {
        const card = root.querySelector('.clock-card');
        if (!card) return;
        // 按浏览器来源的宽高等比放大或缩小：来源设大，卡片就按那个分辨率绘制，不会糊。
        const scale = Math.min(window.innerWidth / card.offsetWidth, window.innerHeight / card.offsetHeight);
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
        card.style.transformOrigin = 'top left';
        card.style.transform = `scale(${safeScale})`;
        root.style.width = `${card.offsetWidth * safeScale}px`;
        root.style.height = `${card.offsetHeight * safeScale}px`;
      }
      // 时钟只用本机时间，不请求卡片数据；每到整秒刷新一次。
      function tick() {
        window.Splat3OverlayCard.updateClock(root);
        window.setTimeout(tick, 1000 - (Date.now() % 1000));
      }
      document.fonts.load('16px "BlitzMain"').catch(() => {});
      tick();
      fitOverlay();
      window.addEventListener('resize', fitOverlay);
    </script>
  </body>
</html>
