<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>私房随武规则</title>
    <style>
      * { box-sizing: border-box; }
      :root { --obs-card-width: __OBS_CARD_WIDTH__px; --obs-card-height: __OBS_CARD_HEIGHT__px; }
      html, body { width: var(--obs-card-width); height: var(--obs-card-height); margin: 0; overflow: hidden; background: transparent; }
      #rules { display: grid; gap: 2px; width: var(--obs-card-width); height: var(--obs-card-height); padding: 8px 10px; border-radius: 8px; color: #f5f5f2; background: rgb(0 0 0 / 22%); }
      h1 { margin: 0; color: #ecff20; font: 800 14px/18px system-ui, sans-serif; }
      ul { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
      li { overflow: hidden; color: rgb(245 245 242 / 88%); font: 500 12px/17px system-ui, sans-serif; white-space: nowrap; text-overflow: ellipsis; }
      li::before { margin-right: 7px; color: #ecff20; content: '•'; }
    </style>
  </head>
  <body>
    <main id="rules" aria-label="私房随武规则">
      <h1>私房随武规则</h1>
      <ul>
        <li>按顺序依次更换武器</li>
        <li>没有同款时，选择同类型武器</li>
        <li>娱乐为主，优先尝试不熟悉的武器</li>
      </ul>
    </main>
  </body>
</html>
