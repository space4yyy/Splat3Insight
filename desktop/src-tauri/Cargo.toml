[package]
name = "splat3-insight"
version = "0.3.6"
description = "Splat3 Insight desktop app for Splatoon 3 statistics and OBS overlays"
authors = ["Splat3 Insight"]
edition = "2021"
autobins = false

[lib]
name = "splat3_insight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Splat3Insight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
splat3-widget-core = { path = "../../desktop-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# 2.13 起要求 Tauri 2.12；先用支持当前 Tauri 2.11 的 2.12 系列。
tauri-plugin-updater = "~2.12"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.dev.package.splat3-widget-core]
debug = "line-tables-only"

