[package]
name = "splat3-insight"
version = "0.1.0"
description = "Splat3 Insight desktop app for Splatoon 3 statistics and OBS overlays"
authors = ["Splat3 Insight"]
edition = "2021"
autobins = false

[lib]
name = "splat3_insight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Splat3Insight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
splat3-widget-core = { path = "../../desktop-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
tempfile = "3"
