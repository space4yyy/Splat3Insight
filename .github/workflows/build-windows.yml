name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-core -> target
            desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Test shared Rust core
        run: cargo test --locked --manifest-path desktop-core/Cargo.toml

      - name: Test desktop host
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm --prefix desktop run tauri -- build --bundles nsis --ci

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Splat3StreamingWidget-windows-x64-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
