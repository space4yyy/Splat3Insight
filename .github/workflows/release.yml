name: Release

# 推送 v* 标签（例如 v0.3.0）时打包 macOS 和 Windows 版，连同自动更新用的文件和
# latest.json 一起上传到同名的 Release 草稿。草稿的说明取自 CHANGELOG.md 里这个
# 版本的一节。检查无误后在网页上发布草稿，已安装的应用才会收到更新。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon and Intel)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # CHANGELOG.md 里没有这个版本的更新内容时，在打包前就停下。
      - name: Read release notes
        id: notes
        run: node desktop/scripts/changelog.mjs notes --github-output

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-core -> target
            desktop/src-tauri -> target

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Test shared Rust core
        run: cargo test --locked --manifest-path desktop-core/Cargo.toml

      - name: Test desktop host
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Test desktop interface
        run: npm --prefix desktop test

      # 手动导入现有证书，避免 Tauri 的自动导入流程过滤掉自签名证书。
      - name: Prepare macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash desktop/scripts/ci-signing.sh prepare

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Splat3 Insight ${{ github.ref_name }}
          releaseBody: |
            ## 更新内容

            ${{ steps.notes.outputs.notes }}

            ## 安装

            ### macOS

            下载并双击打开 `.dmg`，将 **Splat3 Insight** 拖入「应用程序」。

            如果提示「已损坏，无法打开」或「无法验证开发者」，请使用以下方法：

            **方法一：通过终端清除隔离扩展属性**

            打开「终端」，输入 `xattr -dr com.apple.quarantine`，在末尾添加一个空格，然后将无法打开的文件拖进终端，按回车执行。

            - 如果 `.dmg` 无法打开，拖入下载的 `.dmg` 文件。
            - 如果 App 无法启动，拖入「应用程序」中的 `Splat3 Insight.app`。

            执行完成后，再次打开文件或应用。

            **方法二：通过系统设置允许打开**

            尝试打开应用后，进入「系统设置 → 隐私与安全性」。如果出现「仍要打开」按钮，点击后按提示确认。

            ### Windows

            下载 `-setup.exe` 运行。如果出现「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。

            已安装 0.3.0 及以后版本的，会在「设置 → 通用」里收到更新提示。
          releaseDraft: true
          prerelease: false

      - name: Clean up macOS signing certificate
        if: always() && runner.os == 'macOS'
        run: bash desktop/scripts/ci-signing.sh cleanup
